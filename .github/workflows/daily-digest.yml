name: Daily RSS Digest

on:
  schedule:
    # Run at 10:37 AM EST (15:37 UTC) every day
    - cron: '37 15 * * *'
  workflow_dispatch:  # Allow manual trigger

# Never run two digests at the same time — if a manual trigger fires while the
# scheduled run is in flight, queue it instead of duplicating the send.
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # used by the failure-alert step to open an issue

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS Feed Summarizer
        env:
          OPENAIAPIKEY: ${{ secrets.OPENAIAPIKEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          python scripts/run.py

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-output-${{ github.run_number }}
          path: output/*.md
          retention-days: 30

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily digest failed: run #${context.runNumber}`;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled daily digest run failed.`,
              ``,
              `Run: ${url}`,
              `Commit: ${context.sha}`,
              ``,
              `Investigate logs and re-run via workflow_dispatch once fixed.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['digest-failure'],
            });
